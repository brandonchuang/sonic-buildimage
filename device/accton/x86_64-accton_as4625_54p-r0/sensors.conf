# libsensors configuration file for as4625-54p
# ------------------------------------------------
#
bus "i2c-3" "i2c-1-mux (chan_id 1)"
bus "i2c-8" "i2c-1-mux (chan_id 6)"
bus "i2c-9" "i2c-1-mux (chan_id 7)"

chip "ym2651-i2c-*-58"
    label in3 "PSU 1 Voltage"
    label fan1 "PSU 1 Fan"
    label temp1 "PSU 1 Temperature"
    label power2 "PSU 1 Power"
    label curr2 "PSU 1 Current"

chip "ym2651-i2c-*-59"
    label in3 "PSU 2 Voltage"
    label fan1 "PSU 2 Fan"
    label temp1 "PSU 2 Temperature"
    label power2 "PSU 2 Power"
    label curr2 "PSU 2 Current"

chip "as4625_54p_fan-*"
    label fan1 "Fan 1"
    label fan2 "Fan 2"
    label fan3 "Fan 3"

chip "lm75-i2c-*-4a"
    label temp1 "Main board U1 Temperature"

chip "lm75-i2c-*-4b"
    label temp1 "Main board U5 Temperature"

chip "lm75-i2c-*-4d"
    label temp1 "Main board U111 Temperature"

chip "lm75-i2c-*-4e"
    label temp1 "Main board U28 Temperature"

chip "lm75-i2c-*-4f"
    label temp1 "Main board U35 Temperature"
